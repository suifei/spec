<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 2 — 安装：一行，且只碰 .claude</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "WenQuanYi Zen Hei"; src: local("WenQuanYi Zen Hei"); }
        @font-face { font-family: "DejaVu Sans Mono"; src: local("DejaVu Sans Mono"); }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #e6edf3;
          font-family: "WenQuanYi Zen Hei", sans-serif;
        }
        #f2-bg { position: absolute; inset: 0; background: #0d1117; }
        #f2-grid {
          position: absolute; inset: 0;
          background-image: linear-gradient(#30363d 1px, transparent 1px),
            linear-gradient(90deg, #30363d 1px, transparent 1px);
          background-size: 64px 64px; opacity: 0.15;
        }
        #f2-wrap {
          position: absolute; left: 120px; top: 0; width: 1680px; height: 100%;
          display: flex; flex-direction: column; justify-content: center;
        }
        #f2-title { display: block; font-size: 72px; font-weight: 700; letter-spacing: -0.02em; }
        #f2-title-sub { color: #7d8590; font-size: 42px; font-weight: 400; }
        #f2-term {
          margin-top: 44px; background: #161b22; border: 1px solid #30363d;
          border-radius: 14px; overflow: hidden;
        }
        #f2-termbar {
          height: 54px; background: #21262d; display: flex; align-items: center;
          gap: 10px; padding: 0 22px; border-bottom: 1px solid #30363d;
        }
        .f2-dot { display: block; width: 14px; height: 14px; border-radius: 50%; }
        #f2-termname {
          display: block; margin-left: 14px; font-family: "DejaVu Sans Mono", monospace;
          font-size: 24px; color: #7d8590;
        }
        #f2-termbody { padding: 32px 38px; font-family: "DejaVu Sans Mono", monospace; font-size: 26px; }
        #f2-cmdline { display: flex; align-items: baseline; gap: 14px; white-space: nowrap; }
        #f2-prompt { display: block; color: #3fb950; }
        #f2-cmd {
          display: inline-block; overflow: hidden; white-space: nowrap;
          vertical-align: bottom; width: 0;
        }
        #f2-cursor {
          display: inline-block; width: 13px; height: 30px; background: #3fb950;
          vertical-align: -5px; flex: none;
        }
        #f2-ok { display: block; margin-top: 20px; color: #7d8590; }
        .f2-cmdname { font-weight: 700; }
        #f2-cols { display: flex; gap: 96px; margin-top: 52px; }
        .f2-colhead { display: block; font-size: 28px; margin-bottom: 20px; }
        .f2-row { display: flex; gap: 16px; align-items: center; }
        .f2-mark { display: block; font-size: 30px; width: 24px; }
        .f2-path { display: block; font-family: "DejaVu Sans Mono", monospace; font-size: 27px; }
        #f2-foot { display: block; margin-top: 50px; font-size: 44px; }
      </style>

      <div id="root" data-composition-id="02-install" data-width="1920" data-height="1080" data-duration="14">
        <div id="f2-bg"></div>
        <div id="f2-grid"></div>

        <div id="f2-wrap">
          <span id="f2-title">安装<span id="f2-title-sub"> · 一行</span></span>

          <div id="f2-term">
            <div id="f2-termbar">
              <span class="f2-dot" style="background: #ff5f57"></span>
              <span class="f2-dot" style="background: #febc2e"></span>
              <span class="f2-dot" style="background: #28c840"></span>
              <span id="f2-termname">your-project</span>
            </div>
            <div id="f2-termbody">
              <div id="f2-cmdline">
                <span id="f2-prompt">$</span>
                <span id="f2-cmd">curl -fsSL https://raw.githubusercontent.com/suifei/spec/main/scripts/install.sh | bash</span>
                <span id="f2-cursor"></span>
              </div>
              <span id="f2-ok">
                <span style="color: #3fb950">✓</span> installed
                <span class="f2-cmdname" style="color: #3fb950">/spec</span>
                <span class="f2-cmdname" style="color: #58a6ff">/build</span>
                <span class="f2-cmdname" style="color: #bc8cff">/yolo</span>
              </span>
            </div>
          </div>

          <div id="f2-cols">
            <div>
              <span class="f2-colhead" id="f2-head-w" style="color: #3fb950">只写这些</span>
              <div style="display: flex; flex-direction: column; gap: 15px">
                <div class="f2-row" id="f2-w1"><span class="f2-mark" style="color: #3fb950">✓</span><span class="f2-path">.claude/skills/{spec,build,yolo}/</span></div>
                <div class="f2-row" id="f2-w2"><span class="f2-mark" style="color: #3fb950">✓</span><span class="f2-path">.claude/commands/{spec,build,yolo}.md</span></div>
                <div class="f2-row" id="f2-w3"><span class="f2-mark" style="color: #3fb950">✓</span><span class="f2-path">.claude/spec-install.manifest</span></div>
              </div>
            </div>
            <div>
              <span class="f2-colhead" id="f2-head-u" style="color: #7d8590">一个都不碰</span>
              <div style="display: flex; flex-direction: column; gap: 15px">
                <div class="f2-row" id="f2-u1"><span class="f2-mark" style="color: #5c6166">·</span><span class="f2-path" style="color: #7d8590">CLAUDE.md</span></div>
                <div class="f2-row" id="f2-u2"><span class="f2-mark" style="color: #5c6166">·</span><span class="f2-path" style="color: #7d8590">SPEC.md</span></div>
                <div class="f2-row" id="f2-u3"><span class="f2-mark" style="color: #5c6166">·</span><span class="f2-path" style="color: #7d8590">.spec/</span></div>
                <div class="f2-row" id="f2-u4"><span class="f2-mark" style="color: #5c6166">·</span><span class="f2-path" style="color: #7d8590">你的代码</span></div>
              </div>
            </div>
          </div>

          <span id="f2-foot">打开 Claude Code，敲 <span style="color: #3fb950; font-family: 'DejaVu Sans Mono', monospace">/spec</span> 就能开始。</span>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          // Scene 1 (0–2s): title, then the terminal shell rises — empty, waiting
          tl.fromTo("#f2-title", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
          tl.fromTo("#f2-term", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.55);
          tl.fromTo("#f2-cursor", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.2);

          // Scene 2 (2–5.5s): the command types itself — this IS the frame's move
          // measure the full command once (layout is deterministic) so the typing
          // reveal always lands on the last character instead of a guessed pixel width
          const cmdEl = document.querySelector("#f2-cmd");
          const cmdW = cmdEl ? cmdEl.scrollWidth : 1350;
          tl.to("#f2-cmd", { width: cmdW, duration: 3.1, ease: "steps(44)" }, 2.0);

          // Scene 3 (5.5–7.5s): the echo confirms three commands, each in its own colour
          tl.fromTo("#f2-ok", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 5.7);
          tl.to("#f2-cursor", { opacity: 0, duration: 0.25 }, 5.7);

          // Scene 4 (7.5–11s): what it writes, then what it refuses to touch
          tl.fromTo("#f2-head-w", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.4);
          ["#f2-w1", "#f2-w2", "#f2-w3"].forEach(function (s, i) {
            tl.fromTo(s, { opacity: 0, x: -34 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 7.6 + i * 0.22);
          });
          tl.fromTo("#f2-head-u", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.1);
          ["#f2-u1", "#f2-u2", "#f2-u3", "#f2-u4"].forEach(function (s, i) {
            tl.fromTo(s, { opacity: 0, x: 34 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 9.3 + i * 0.2);
          });

          // Scene 5 (11–13.5s): the invitation, then stillness
          tl.fromTo("#f2-foot", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 11.0);

          window.__timelines["02-install"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
