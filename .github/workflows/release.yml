name: Release Skills Package

on:
  push:
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package skills
        id: package
        run: |
          TAG="${{ github.ref_name }}"
          ZIP="spec-skills-${TAG}.zip"

          # List exactly the 8 distributable files - no staging dir needed
          zip -r "$ZIP" \
            .claude/skills/spec/SKILL.md \
            .claude/skills/spec/references/probes.md \
            .claude/skills/spec/references/SPEC.template.md \
            .claude/skills/spec/references/STATE.template.md \
            .claude/skills/spec/references/knowledge.template.md \
            .claude/skills/spec/references/questioning.md \
            .claude/skills/build/SKILL.md \
            .claude/commands/spec.md \
            .claude/commands/build.md

          # Verify zip contents
          echo "=== ZIP contents ==="
          unzip -l "$ZIP"
          echo "=== END ==="

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          ZIP="${{ steps.package.outputs.zip }}"

          gh release create "$TAG" \
            --title "Skills ${TAG}" \
            --notes '## /spec + /build Skills Package

            Extract this zip into your project root.

            ### Contents

            ```
            .claude/
            ├── skills/
            │   ├── spec/
            │   │   ├── SKILL.md
            │   │   └── references/
            │   └── build/
            │       └── SKILL.md
            └── commands/
                ├── spec.md
                └── build.md
            ```

            ### Install

            **PowerShell**
            ```powershell
            Expand-Archive -Path skills.zip -DestinationPath . -Force
            ```

            **Bash**
            ```bash
            unzip -o skills.zip
            ```

            Then run `/spec` in Claude Code.' \
            "$ZIP"
