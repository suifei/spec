name: Release Skills Package

on:
  push:
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package skills
        id: package
        run: |
          TAG="${{ github.ref_name }}"
          ZIP="spec-skills-${TAG}.zip"

          # List exactly the 11 distributable files - no staging dir needed
          zip -r "$ZIP" \
            .claude/skills/spec/SKILL.md \
            .claude/skills/spec/references/probes.md \
            .claude/skills/spec/references/SPEC.template.md \
            .claude/skills/spec/references/STATE.template.md \
            .claude/skills/spec/references/knowledge.template.md \
            .claude/skills/spec/references/questioning.md \
            .claude/skills/build/SKILL.md \
            .claude/skills/yolo/SKILL.md \
            .claude/commands/spec.md \
            .claude/commands/build.md \
            .claude/commands/yolo.md \
            CLAUDE_template.md

          # Verify zip contents
          echo "=== ZIP contents ==="
          unzip -l "$ZIP"
          echo "=== END ==="

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          ZIP="${{ steps.package.outputs.zip }}"

          gh release create "$TAG" \
            --title "Skills ${TAG}" \
            --notes '## /spec + /build + /yolo Skills Package

            Extract this zip into your project root.

            ### Contents

            ```
            .claude/
            ├── CLAUDE_template.md
            ├── skills/
            │   ├── spec/
            │   │   ├── SKILL.md
            │   │   └── references/
            │   ├── build/
            │   │   └── SKILL.md
            │   └── yolo/
            │       └── SKILL.md
            └── commands/
                ├── spec.md
                ├── build.md
                └── yolo.md
            ```

            ### Install

            **PowerShell**
            ```powershell
            Expand-Archive -Path spec-skills-*.zip -DestinationPath . -Force
            ```

            **Bash**
            ```bash
            unzip -o spec-skills-*.zip
            ```

            Then run `/spec` in Claude Code.' \
            "$ZIP"
