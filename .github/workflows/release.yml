name: Release Skills Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2026-07-06)'
        required: false
        default: 'v2026-07-06'

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing (workflow_dispatch)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ! git tag -l | grep -q "^${TAG}$"; then
            git config user.name "flynn"
            git config user.email "suifei@gmail.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Package skills
        id: package
        run: |
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/.claude/skills/spec"
          mkdir -p "$STAGE/.claude/skills/build"
          mkdir -p "$STAGE/.claude/commands"

          # Copy only the distributable files — nothing else
          cp -r .claude/skills/spec/*   "$STAGE/.claude/skills/spec/"
          cp -r .claude/skills/build/*  "$STAGE/.claude/skills/build/"
          cp   .claude/commands/spec.md  "$STAGE/.claude/commands/spec.md"
          cp   .claude/commands/build.md "$STAGE/.claude/commands/build.md"

          ZIP="spec-skills-${{ steps.tag.outputs.tag }}.zip"
          (cd "$STAGE" && zip -r "../$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create Release from Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ZIP="${{ steps.package.outputs.zip }}"

          gh release create "$TAG" \
            --title "Skills ${TAG}" \
            --notes "## /spec + /build Skills Package

            Extract this zip into your project root — it installs the
            \`.claude/skills/\` and \`.claude/commands/\` files that Claude Code
            needs for the \`/spec\` and \`/build\` commands.

            ### Contents

            \`\`\`
            .claude/
            ├── skills/
            │   ├── spec/
            │   │   ├── SKILL.md
            │   │   └── references/
            │   └── build/
            │       └── SKILL.md
            └── commands/
                ├── spec.md
                └── build.md
            \`\`\`

            ### Quick Install

            **PowerShell**
            \`\`\`powershell
            iwr -UseBasicParsing https://github.com/suifei/spec/releases/download/${TAG}/spec-skills-${TAG}.zip -OutFile skills.zip
            Expand-Archive -Path skills.zip -DestinationPath . -Force
            \`\`\`

            **Bash**
            \`\`\`bash
            curl -fsLO https://github.com/suifei/spec/releases/download/${TAG}/spec-skills-${TAG}.zip
            unzip -o skills.zip
            \`\`\`

            Then open Claude Code in your project and run \`/spec\` to start." \
            "$ZIP"
