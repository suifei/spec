name: Release Skills Package

on:
  push:
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package skills
        id: package
        run: |
          TAG="${{ github.ref_name }}"
          ZIP="spec-skills-${TAG}.zip"

          bash scripts/verify-distribution.sh
          cut -d'|' -f2 scripts/distributable-files.txt | zip "$ZIP" -@
          sha256sum "$ZIP" > "$ZIP.sha256"

          # Verify zip contents
          echo "=== ZIP contents ==="
          unzip -l "$ZIP"
          echo "=== END ==="

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          ZIP="${{ steps.package.outputs.zip }}"

          gh release create "$TAG" \
            --title "Skills ${TAG}" \
            --notes '## /spec + /build + /yolo Skills Package

            Extract this zip into a temporary directory, then use its transactional
            installer with that directory as the local source. Do not unzip over an
            existing project.

            ### Contents

            ```
            CLAUDE_template.md
            .claude/
            ├── skills/
            │   ├── spec/
            │   │   ├── SKILL.md
            │   │   └── references/
            │   ├── build/
            │   │   └── SKILL.md
            │   └── yolo/
            │       └── SKILL.md
            └── commands/
                ├── spec.md
                ├── build.md
                └── yolo.md
            ```

            ### Install

            **PowerShell**
            ```powershell
            Expand-Archive spec-skills-*.zip -DestinationPath $env:TEMP\spec-skills -Force
            & $env:TEMP\spec-skills\scripts\install.ps1 -Source $env:TEMP\spec-skills -Target <project>
            ```

            **Bash**
            ```bash
            tmp=$(mktemp -d); unzip spec-skills-*.zip -d "$tmp"
            SPEC_INSTALL_SOURCE="$tmp" bash "$tmp/scripts/install.sh" <project>
            ```

            Verify `spec-skills-<tag>.zip.sha256`, extract, then run `/spec` in Claude Code.' \
            "$ZIP" "$ZIP.sha256"
